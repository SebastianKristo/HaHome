                left: -1px;
                padding-bottom: 100;
                padding-left: 10px;
                z-index: 0; 
                  }
decluttering_templates:
  light_slider:
    card:
      type: custom:big-slider-card
      entity: '[[entity]]'
      name: '[[name]]'
      attribute: brightness
      transition: 0.3
      height: 75
      background_color: '[[background]]'
      color: '#ffd4c1'
      icon_color: black
      icon: '[[icon]]'
      show_percentage: true
      min: 0
      max: 100
      hold_time: 600
      settle_time: 3000
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      card_mod:
        style: |
          {% if is_state('[[entity]]', 'on') %}
            #container{background:[[background]]!important;margin-bottom: 12px;}
            #name {color:black!important;font-size:14px!important;font-weight: 300!important;opacity:0.7}
            #percentage {font-size:16px!important;color: black!important;font-weight:500!important;}
            #slider {opacity: 1!important;background: active-light!important}
          {% else %}
            #container {background:[[background]]!important;margin-bottom: 12px;}
            #name {color:gray800!important;font-size:14px!important;font-weight: 300!important;opacity:0.7}
            #percentage {color:gray800!important;font-size:16px!important;font-weight:500!important;}
            #icon {color: gray800!important; opacity: 1!important;filter: none;}
          {% endif %}
  light_toggle:
    card:
      type: custom:button-card
      entity: '[[entity]]'
      name: '[[name]]'
      icon: '[[icon]]'
      show_label: true
      state:
        - value: 'on'
          label: På
          styles:
            card:
              - background: '[[background]]'
        - value: 'off'
          label: Av
          styles:
            card:
              - background: '[[background]]'
            name:
              - color: gray800
            label:
              - color: gray800
            icon:
              - color: gray800
        - value: unavailable
          label: Av
          styles:
            card:
              - background: '[[background]]'
            name:
              - color: gray800
            label:
              - color: gray800
            icon:
              - color: gray800
      styles:
        grid:
          - grid-template-columns: 54px 1fr
          - grid-template-areas: '"i n" "i l"'
        icon:
          - width: 24px
          - color: black
        img_cell:
          - justify-self: start
          - width: 24px
          - height: 24px
          - padding: 0 6px
        label:
          - justify-self: start
          - font-size: 16px
          - font-weight: 500
          - padding-top: 2px
          - color: black
        card:
          - padding: 18px
          - height: 75px
          - margin-bottom: 12px
        name:
          - justify-self: start
          - font-size: 14px
          - color: black
          - opacity: 0.7
          - padding-bottom: 2px
button_card_templates:
  card_title:
    tap_action:
      action: none
    show_icon: false
    show_label: true
    show_name: true
    styles:
      card:
        - background-color: rgba(0,0,0,0)
        - box-shadow: none
        - height: auto
        - width: auto
      grid:
        - grid-template-areas: '''n'' ''l'''
        - grid-template-columns: 1fr
        - grid-template-rows: min-content min-content
      name:
        - justify-self: start
        - font-weight: bold
      label:
        - justify-self: start
        - font-weight: bold
        - font-size: 1rem
        - opacity: '0.4'
  list_2_items:
    styles:
      grid:
        - grid-template-areas: '''item1 item2'''
        - grid-template-columns: 1fr 1fr
        - grid-template-rows: min-content
        - column-gap: 7px
      card:
        - box-shadow: none
        - padding: 0px
