    icon: ""
    heading: 📺 Pult
    heading_style: title
    tap_action:
      action: navigate
      navigation_path: /ui-minimalist/homekit-pult
    badges:
      - type: entity
        entity: sensor.multisensor_multisensor_temperature
  - type: vertical-stack
    cards:
      - type: horizontal-stack
        cards:
          - features:
              - type: light-brightness
            type: tile
            entity: light.pultlampe
          - type: vertical-stack
            cards:
              - type: tile
                entity: light.pultskjermer
                state_content:
                  - state
                  - last-changed
                card_mod:
                  style: |
                    ha-card:active {
                      transform: scale(0.975);
                      transition: 0s;
                    }
              - type: tile
                entity: light.oljelampe_pc
                state_content:
                  - state
                  - last-changed
                card_mod:
                  style: |
                    ha-card:active {
                      transform: scale(0.975);
                      transition: 0s;
                    }
      - type: horizontal-stack
        cards:
          - type: tile
            entity: light.pult_ledstrip
            state_content:
              - state
              - last-changed
            card_mod:
              style: |
                ha-card:active {
                  transform: scale(0.975);
                  transition: 0s;
                }
          - type: tile
            entity: media_player.pult
            vertical: false
            tap_action:
              action: navigate
              navigation_path: "#sonos"
            card_mod:
              style: |
                ha-state-icon {
                  {% if is_state(config.entity, 'on') %}
                  animation: rotate .5s infinite linear}
                @keyframes rotate {
                    0% {
                      transform: rotate(0deg);
                    }
                    100% {
                      transform: rotate(-359deg);
                    }
                  }
                  {% endif %}
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.vis_alt
            state: "on"
        card:
          type: vertical-stack
          cards:
            - type: horizontal-stack
              cards:
                - type: tile
                  entity: switch.dual_action_switch
                  name: Pc
                  icon: phu:rooms-computer
                  card_mod:
                    style: |
                      ha-card:active {
                        transform: scale(0.975);
                        transition: 0s;
                      }
                - type: tile
                  entity: switch.pult_skjermer_socket_1
            - type: horizontal-stack
              cards:
                - type: tile
                  entity: input_select.radio
                  state_content:
                    - state
                    - last-changed
                  card_mod:
                    style: |
                      {% if is_state('media_player.pult_2', 'playing') %}
                      ha-state-icon {
                          animation: beat 1.3s ease-out infinite both;
                          transform-origin: 50% 80%;
                        }
                        @keyframes beat {
                          0% { transform: scale(1); }
                          10% { transform: scale(1.1); }
                          17% { transform: scale(1.05); }
                          33% { transform: scale(1.25); }
                          60% { transform: scale(1); }
                        }
                      {% endif %}
                - type: tile
                  entity: fan.pultvifte
                  state_content:
                    - state
                    - last-changed
                  card_mod:
                    style: |
                      {% if is_state('media_player.pult_2', 'playing') %}
                      ha-state-icon {
                          animation: beat 1.3s ease-out infinite both;
                          transform-origin: 50% 80%;
                        }
                        @keyframes beat {
                          0% { transform: scale(1); }
                          10% { transform: scale(1.1); }
                          17% { transform: scale(1.05); }
                          33% { transform: scale(1.25); }
                          60% { transform: scale(1); }
                        }
                      {% endif %}
  - type: heading
    icon: ""
    heading: 🛌 Soverom
    heading_style: title
    tap_action:
      action: navigate
      navigation_path: "#soverom"
    badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.multisensor_multisensor_temperature
  - type: vertical-stack
    cards:
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.vis_alt
            state: "off"
        card:
          type: vertical-stack
          cards:
            - type: horizontal-stack
              cards:
                - features:
                    - type: target-temperature
                  type: tile
                  entity: climate.panelovn
                  card_mod:
                    style: |
                      mushroom-shape-icon {
                        {% if is_state(config.entity, 'heat_cool') %}
                          --card-mod-icon: mdi:autorenew;
                          animation: spin 3s ease-in-out infinite alternate;
                        {% elif is_state(config.entity, 'heat') %}
                          --card-mod-icon: mdi:fire;
                          animation: heat 2s infinite;
                        {% elif is_state(config.entity, 'cool') %}
                          --card-mod-icon: mdi:snowflake;
                          animation: cool 6s ease-in-out infinite;
                        {% elif is_state(config.entity, 'dry') %}
                          --card-mod-icon: mdi:water-percent;
                          animation: dry 1.5s linear infinite;
                        {% elif is_state(config.entity, 'fan_only') %}
                          --card-mod-icon: mdi:fan;
                          animation: spin 1s linear infinite;
                        {% else %}
                          --card-mod-icon: mdi:air-conditioner; 
                        {% endif %}
                        display: flex;
                      }
                      @keyframes cool {
                        0%, 100% { transform: rotate(25deg); }
                        25% { transform: rotate(-25deg); }
                        50% { transform: rotate(50deg); }
                        75% { transform: rotate(-50deg); }
                      }
                      @keyframes heat {
                        0%, 100% { --icon-color: rgba(var(--rgb-red), 1); }
                        10%, 90% { --icon-color: rgba(var(--rgb-red), 0.8); }
                        20%, 80% { --icon-color: rgba(var(--rgb-red), 0.6); }
                        30%, 70% { --icon-color: rgba(var(--rgb-red), 0.4); }
                        40%, 60% { --icon-color: rgba(var(--rgb-red), 0.2); }
                        50% { --icon-color: rgba(var(--rgb-red), 0); }
                      }
                      @keyframes dry {
                        0%, 100% { --icon-symbol-size: 21px; }
                        10%, 90% { --icon-symbol-size: 22px; }
                        20%, 80% { --icon-symbol-size: 23px; }
                        30%, 70% { --icon-symbol-size: 24px; }
                        40%, 60% { --icon-symbol-size: 25px; }
                        50% { --icon-symbol-size: 26px; }
                      }
                - type: vertical-stack
                  cards:
                    - type: tile
                      entity: light.vindulampe
                      vertical: false
                      card_mod:
                        style: |
                          ha-card:active {
                            transform: translateY(-1.5px);
                            transition: 0s;
                            box-shadow: 0 0.5px 2px 0 rgba(0, 0, 0, 0.16);
                          }
                    - type: tile
                      entity: light.gitarlampe
                      card_mod:
                        style: |
                          ha-card:active {
                            transform: translateY(-1.5px);
                            transition: 0s;
                            box-shadow: 0 0.5px 2px 0 rgba(0, 0, 0, 0.16);
                          }
            - type: horizontal-stack
              cards:
                - type: vertical-stack
                  cards:
                    - type: tile
                      entity: switch.hoytallere_pc
                      card_mod:
                        style: |
                          ha-state-icon {
                              animation: beat 1.3s ease-out infinite both;
                              transform-origin: 50% 80%;
                            }
                            @keyframes beat {
                              0% { transform: scale(1); }
                              10% { transform: scale(1.1); }
                              17% { transform: scale(1.05); }
                              33% { transform: scale(1.25); }
                              60% { transform: scale(1); }
                            }
                    - type: tile
                      entity: light.nattlampe
                      icon: ""
                      state_content:
                        - state
                        - last-changed
                      card_mod:
                        style: |
                          {% if is_state('media_player.soverom_2', 'playing') %}
                          ha-state-icon {
                              animation: beat 1.3s ease-out infinite both;
                              transform-origin: 50% 80%;
                            }
                            @keyframes beat {
                              0% { transform: scale(1); }
                              10% { transform: scale(1.1); }
                              17% { transform: scale(1.05); }
                              33% { transform: scale(1.25); }
                              60% { transform: scale(1); }
                            }
                          {% endif %}
                - type: custom:mushroom-vacuum-card
                  entity: vacuum.sir_sweeps_a_lot
                  icon_animation: true
                  commands:
                    - locate
                    - return_home
                    - start_pause
                  fill_container: true
